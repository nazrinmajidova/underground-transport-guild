name: Java build and tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    defaults:
      run:
        working-directory: underground_guild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: underground_guild/pom.xml
      # Existing JavaFX control smoke tests skip when CI=true.
      - name: Compile and test
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: underground_guild/target/surefire-reports/
          if-no-files-found: ignore
